<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Studio - OpenGraph Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            background-color: #0A0A0A;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glow Backdrop */
        .glow-mesh {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background: 
                radial-gradient(circle at 50% 40%, rgba(187, 242, 148, 0.16) 0%, transparent 60%),
                radial-gradient(circle at 50% 65%, rgba(148, 161, 242, 0.14) 0%, transparent 65%),
                radial-gradient(circle at 15% 20%, rgba(104, 223, 233, 0.1) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(148, 161, 242, 0.08) 0%, transparent 45%);
        }

        /* Tech Grid Dot Pattern */
        .grid-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Card Container Boundary */
        .card-container {
            width: 1120px;
            height: 550px;
            background: rgba(18, 19, 23, 0.7);
            border: 1px solid rgba(187, 242, 148, 0.22);
            border-radius: 36px;
            backdrop-filter: blur(30px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 70px 60px 40px;
            text-align: center;
            position: relative;
            z-index: 2;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 0 50px rgba(187, 242, 148, 0.08);
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            margin: auto 0;
        }

        /* Brand Row Header */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .logo-img {
            width: 138px;
            height: 138px;
            object-fit: contain;
        }

        /* White to Gray Gradient Title matching homepage */
        .title {
            font-size: 80px;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1;
            background: linear-gradient(135deg, #FFFFFF 0%, #A0A0A0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 3-Stop Luminous Vibrant Gradient Tagline (Lime -> Turquoise -> Periwinkle) */
        .tagline {
            display: inline-block;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.3;
            background: linear-gradient(90deg, #BBF294 0%, #68DFE9 50%, #94A1F2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 15px rgba(104, 223, 233, 0.25));
        }

        /* Web3 Enterprise Footer Bar */
        .card-footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.5);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .footer-domain {
            color: #BBF294;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #BBF294;
            box-shadow: 0 0 8px #BBF294;
        }
    </style>
</head>

<body>
    <div class="glow-mesh"></div>
    <div class="grid-pattern"></div>
    <div class="card-container">
        <div class="main-content">
            <div class="brand-header">
                <img src="assets/logo_grad.png" alt="Token Studio Logo" class="logo-img">
                <h1 class="title">Token Studio</h1>
            </div>
            <p class="tagline">Elevate your control. Define your legacy.</p>
        </div>

        <div class="card-footer">
            <div class="footer-domain">
                <span class="status-dot"></span>
                tokenstudio.dev
            </div>
            <div>The Solana Control Surface</div>
        </div>
    </div>
</body>

</html>
